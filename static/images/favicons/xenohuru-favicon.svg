<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark amber background for browser tab visibility -->
  <rect width="32" height="32" fill="#1A1208" rx="6"/>
  <!-- Mini acacia tree -->
  <g transform="translate(16, 17)">
    <!-- Trunk -->
    <rect x="-1.5" y="5" width="3" height="9" rx="1" fill="#8B5E3C"/>
    <!-- Branches -->
    <line x1="-1.5" y1="10" x2="-6" y2="8"  stroke="#8B5E3C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="1.5"  y1="9"  x2="6"  y2="7"  stroke="#8B5E3C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-1"   y1="7"  x2="-8" y2="4"  stroke="#8B5E3C" stroke-width="1"   stroke-linecap="round"/>
    <line x1="1"    y1="6"  x2="8"  y2="3"  stroke="#8B5E3C" stroke-width="1"   stroke-linecap="round"/>
    <!-- Canopy -->
    <ellipse cx="0"   cy="-1" rx="10" ry="5"  fill="#C9A84C"/>
    <ellipse cx="-6"  cy="1"  rx="5"  ry="3"  fill="#C9A84C"/>
    <ellipse cx="6"   cy="1"  rx="5"  ry="3"  fill="#C9A84C"/>
    <ellipse cx="0"   cy="-3" rx="7"  ry="3"  fill="#E2C76A"/>
    <ellipse cx="0"   cy="-6" rx="4"  ry="2"  fill="#EDD47A"/>
  </g>
  <!-- Amber dot accent -->
  <circle cx="16" cy="29" r="1.5" fill="#C8722A" opacity="0.8"/>
</svg>
