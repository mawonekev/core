<svg width="220" height="56" viewBox="0 0 220 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xenohuru — Gundua Tanzania">
  <!-- Acacia tree icon — transparent background, works on light surfaces -->
  <g transform="translate(28, 30)">
    <!-- Trunk -->
    <rect x="-3" y="8" width="6" height="18" rx="2" fill="#8B5E3C"/>
    <!-- Lower branches -->
    <line x1="-2.5" y1="18" x2="-14" y2="13" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2.5"  y1="16" x2="15"  y2="11" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Upper branches -->
    <line x1="-2" y1="11" x2="-20" y2="4" stroke="#8B5E3C" stroke-width="2" stroke-linecap="round"/>
    <line x1="2"  y1="10" x2="21"  y2="3" stroke="#8B5E3C" stroke-width="2" stroke-linecap="round"/>
    <line x1="0"  y1="8"  x2="0"   y2="2" stroke="#8B5E3C" stroke-width="2" stroke-linecap="round"/>
    <!-- Canopy — layered gold ellipses -->
    <ellipse cx="0"   cy="-4"  rx="26" ry="11" fill="#C9A84C"/>
    <ellipse cx="-16" cy="-1"  rx="13" ry="7"  fill="#C9A84C"/>
    <ellipse cx="17"  cy="-2"  rx="14" ry="7"  fill="#C9A84C"/>
    <ellipse cx="-8"  cy="-8"  rx="12" ry="6"  fill="#D4B85A"/>
    <ellipse cx="10"  cy="-9"  rx="13" ry="6"  fill="#D4B85A"/>
    <ellipse cx="0"   cy="-12" rx="16" ry="6"  fill="#E2C76A"/>
    <ellipse cx="0"   cy="-16" rx="8"  ry="4"  fill="#EDD47A"/>
  </g>

  <!-- Brand name — dark text for light backgrounds -->
  <text
    x="62" y="29"
    font-family="Georgia, serif"
    font-size="21"
    font-weight="700"
    fill="#1A1208"
    letter-spacing="3"
  >XENOHURU</text>

  <!-- Tagline -->
  <text
    x="63" y="43"
    font-family="Georgia, serif"
    font-size="7.5"
    fill="#7A6B52"
    letter-spacing="2.5"
  >GUNDUA TANZANIA</text>

  <!-- Amber accent lines -->
  <line x1="63"  y1="47" x2="91"  y2="47" stroke="#C8722A" stroke-width="0.6" opacity="0.7"/>
  <line x1="155" y1="47" x2="183" y2="47" stroke="#C8722A" stroke-width="0.6" opacity="0.7"/>
</svg>
