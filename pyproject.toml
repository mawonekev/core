[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", "staticfiles", "static", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests.py", "*/__init__.py"]

[tool.coverage.report]
skip_empty = true
